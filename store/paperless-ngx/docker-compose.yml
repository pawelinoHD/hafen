services:
  broker:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis:/data
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - broker
    ports:
      - "${APP_PORT}:8000"
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_SECRET_KEY: ${APP_SECRET}
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: ${APP_PASSWORD}
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: ${HAFEN_ORIGINS}
      USERMAP_UID: ${PUID}
      USERMAP_GID: ${PGID}
    volumes:
      - ${APP_DATA_DIR}/data:/usr/src/paperless/data
      - ${APP_DATA_DIR}/media:/usr/src/paperless/media
      - ${HAFEN_STORAGE}/Dokumente/Eingang:/usr/src/paperless/consume
volumes:
  redis:
