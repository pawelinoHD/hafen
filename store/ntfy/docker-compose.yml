services:
  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    ports:
      - "${APP_PORT}:80"
    environment:
      TZ: ${TZ}
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    volumes:
      - ${APP_DATA_DIR}/cache:/var/cache/ntfy
      - ${APP_DATA_DIR}/config:/etc/ntfy
