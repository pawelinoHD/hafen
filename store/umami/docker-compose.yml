services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT}:3000"
    environment:
      DATABASE_URL: postgresql://umami:${APP_SECRET}@db:5432/umami
      APP_SECRET: ${APP_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${APP_SECRET}
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${APP_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d umami -U umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database:/var/lib/postgresql/data
volumes:
  database:
