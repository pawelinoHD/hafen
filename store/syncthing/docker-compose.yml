services:
  syncthing:
    image: syncthing/syncthing:latest
    restart: unless-stopped
    hostname: hafen
    ports:
      - "${APP_PORT}:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${APP_DATA_DIR}:/var/syncthing
      - ${HAFEN_STORAGE}:/hafen
