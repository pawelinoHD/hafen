services:
  freshrss:
    image: freshrss/freshrss:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    environment:
      TZ: ${TZ}
      CRON_MIN: "*/20"
    volumes:
      - ${APP_DATA_DIR}/data:/var/www/FreshRSS/data
      - ${APP_DATA_DIR}/extensions:/var/www/FreshRSS/extensions
