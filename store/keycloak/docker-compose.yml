services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev"]
    ports:
      - "${APP_PORT}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${APP_PASSWORD}
    volumes:
      - data:/opt/keycloak/data
volumes:
  data:
