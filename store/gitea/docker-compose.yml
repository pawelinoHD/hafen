services:
  gitea:
    image: gitea/gitea:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT}:3000"
      - "2222:22"
    environment:
      USER_UID: ${PUID}
      USER_GID: ${PGID}
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__SSH_PORT: "2222"
    volumes:
      - ${APP_DATA_DIR}:/data
