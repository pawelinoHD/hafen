services:
  linkding:
    image: sissbruecker/linkding:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT}:9090"
    environment:
      LD_SUPERUSER_NAME: admin
      LD_SUPERUSER_PASSWORD: ${APP_PASSWORD}
      LD_CSRF_TRUSTED_ORIGINS: ${HAFEN_ORIGINS}
    volumes:
      - ${APP_DATA_DIR}:/etc/linkding/data
