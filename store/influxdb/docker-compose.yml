services:
  influxdb:
    image: influxdb:2
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${APP_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: hafen
      DOCKER_INFLUXDB_INIT_BUCKET: hafen
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${APP_SECRET}
    volumes:
      - data:/var/lib/influxdb2
      - config:/etc/influxdb2
volumes:
  data:
  config:
