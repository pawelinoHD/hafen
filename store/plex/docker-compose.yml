services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT}:32400"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM}
    volumes:
      - ${APP_DATA_DIR}:/config
      - ${HAFEN_STORAGE}/Medien:/media
