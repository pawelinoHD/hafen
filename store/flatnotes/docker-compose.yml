services:
  flatnotes:
    image: dullage/flatnotes:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8080"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      FLATNOTES_AUTH_TYPE: password
      FLATNOTES_USERNAME: admin
      FLATNOTES_PASSWORD: ${APP_PASSWORD}
      FLATNOTES_SECRET_KEY: ${APP_SECRET}
    volumes:
      - ${HAFEN_STORAGE}/Notizen/Flatnotes:/data
