services:
  joplin:
    image: joplin/server:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${APP_PORT}:22300"
    environment:
      APP_PORT: "22300"
      APP_BASE_URL: ${APP_URL}
      DB_CLIENT: pg
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: ${APP_SECRET}
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: ${APP_SECRET}
    volumes:
      - database:/var/lib/postgresql/data
volumes:
  database:
