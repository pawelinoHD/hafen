services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT}:5678"
    environment:
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      # Ohne HTTPS würde n8n die Anmeldung im Heimnetz sonst verweigern
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${APP_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - data:/home/node/.n8n
volumes:
  data:
